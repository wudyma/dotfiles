# yazi — main config
# https://yazi-rs.github.io/docs/configuration/yazi

[mgr]
# Show hidden files by default
show_hidden = true
# Sort naturally: 1.md, 2.md, 10.md.
sort_by = "natural"
sort_dir_first = true
sort_reverse = false
# Sensible column ratio: [parent, current, preview]
ratio = [1, 3, 4]

[preview]
# Image preview max size
max_width = 1000
max_height = 1000

[opener]
# Open text files in Neovim in the same terminal
edit = [
    { run = 'nvim %s', block = true, for = "unix" },
    { run = 'nvim %s', block = true, for = "windows" },
]

[open]
# Use system defaults for these file types
prepend_rules = [
    { mime = "image/*", use = "open" },
    { mime = "video/*", use = "open" },
    { mime = "audio/*", use = "open" },
    { mime = "application/pdf", use = "open" },
]
