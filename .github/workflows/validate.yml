name: Validate dotfiles

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  validate:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Check required versioned files
        run: git ls-files --error-unmatch config/nvim/lazy-lock.json
      - name: Check Bash syntax
        run: bash -n install/install.sh
      - name: Install shell test dependencies (Fish 4+)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv bash)"
          fi
          brew install fish zsh tmux neovim starship bat eza oxfmt
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Check test tools
        run: |
          fish --version
          zsh --version
          tmux -V
          nvim --version
          starship --version
          bat --version
          eza --version
          oxfmt --version
      - name: Lint workflow and installer
        if: runner.os == 'Linux'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv bash)"
          brew install actionlint shellcheck
          actionlint
          shellcheck install/install.sh
      - name: Test installer without changing the runner's home
        run: python3 -m unittest discover -s tests -v
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Windows backups, symlinks, and junctions
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/test_windows.ps1
